<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>

    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        input, select, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2>Personal Expense Calculator</h2>

    <input id="income" type="number" placeholder="Enter Income">

    <input id="amount" type="number" placeholder="Expense Amount">

    <input id="name" type="text" placeholder="Expense Name">

    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Education</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Other</option>
    </select>

    <button onclick="addExpense()">Add Expense</button>

    <div id="result">
        <p>Total Expense: ₹0</p>
        <p>Savings: ₹0</p>
    </div>

    <script>
        let expenses = [];
        let total = 0;

        function addExpense() {
            let income = Number(document.getElementById("income").value);
            let amount = Number(document.getElementById("amount").value);
            let name = document.getElementById("name").value;
            let category = document.getElementById("category").value;

            if (amount <= 0 || name == "") {
                alert("Enter valid details");
                return;
            }

            expenses.push({ name, amount, category });
            total += amount;

            let savings = income - total;

            document.getElementById("result").innerHTML = `
                <p>Total Expense: ₹${total}</p>
                <p>Savings: ₹${savings}</p>
                <p>Category: ${category}</p>
                <p>Last Expense: ${name}</p>
            `;
        }
    </script>

</body>
</html>
